<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Corkboard app icon: a framed cork board with a pinned polaroid and a red push pin. Source for icon.icns / icon.ico. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b47a45"/><stop offset=".5" stop-color="#8f5a2f"/><stop offset="1" stop-color="#6a3f1e"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a56b"/><stop offset="1" stop-color="#c08546"/>
    </linearGradient>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="8" r="3" fill="#8a5528" opacity=".35"/><circle cx="24" cy="5" r="2" fill="#fff0d0" opacity=".35"/>
      <circle cx="17" cy="21" r="3.4" fill="#8a5528" opacity=".28"/><circle cx="31" cy="27" r="2.2" fill="#8a5528" opacity=".3"/>
      <circle cx="8" cy="30" r="2" fill="#fff0d0" opacity=".3"/>
    </pattern>
    <radialGradient id="pin" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8aa0"/><stop offset=".45" stop-color="#d6264f"/><stop offset="1" stop-color="#7d0f28"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dc1d6"/><stop offset=".55" stop-color="#e7c08d"/><stop offset="1" stop-color="#d98a6a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2a1404" flood-opacity=".45"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="6" dy="12" stdDeviation="8" flood-color="#2a1404" flood-opacity=".5"/></filter>
  </defs>
  <!-- board (macOS-style margin around the shape) -->
  <rect x="92" y="92" width="840" height="840" rx="180" fill="url(#frame)" filter="url(#sh)"/>
  <rect x="150" y="150" width="724" height="724" rx="128" fill="url(#cork)"/>
  <rect x="150" y="150" width="724" height="724" rx="128" fill="url(#grain)"/>
  <rect x="150" y="150" width="724" height="724" rx="128" fill="none" stroke="#5a3215" stroke-opacity=".35" stroke-width="10"/>
  <!-- polaroid -->
  <g transform="rotate(-7 512 540)" filter="url(#sh2)">
    <rect x="330" y="330" width="364" height="420" rx="10" fill="#fffdf8"/>
    <rect x="356" y="356" width="312" height="300" fill="url(#photo)"/>
    <path d="M356 600 L450 520 L520 580 L590 500 L668 590 L668 656 L356 656 Z" fill="#6d8f6a" opacity=".85"/>
    <circle cx="600" cy="420" r="34" fill="#fff6d8" opacity=".9"/>
  </g>
  <!-- push pin -->
  <ellipse cx="540" cy="372" rx="58" ry="22" fill="#2a1404" opacity=".35"/>
  <circle cx="512" cy="330" r="74" fill="url(#pin)"/>
  <ellipse cx="486" cy="300" rx="26" ry="18" fill="#fff" opacity=".55"/>
</svg>
